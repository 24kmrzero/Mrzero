<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0A0A0A"><title>Free Course | 24K Excellence</title><link rel="icon" href="../assets/logo.png"><link rel="stylesheet" href="../app.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"></head><body class="app-page"><div class="loading-screen"><div><img src="../assets/logo.png" alt="24K Excellence"><i class="fa-solid fa-spinner fa-spin"></i><p>Preparing free-course enrollment...</p></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/config.js"></script><script src="../assets/js/tracking.js"></script><script>window.addEventListener('DOMContentLoaded',()=>{const q=new URLSearchParams(location.search);const requested=q.get('course')||q.get('course_slug');if(requested)localStorage.setItem('24k_course_intent',requested);else if(!localStorage.getItem('24k_course_intent'))localStorage.setItem('24k_course_intent',(window.APP_CONFIG&&APP_CONFIG.DEFAULT_FREE_COURSE_SLUG)||'free-course');const target='../login.html?tab=signup'+(q.toString()?'&'+q.toString():'');setTimeout(()=>location.replace(target),150);});</script></body></html>
