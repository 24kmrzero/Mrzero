<!DOCTYPE html>
<html lang="en" data-auth-scope="admin">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0A0A0A"><title>Reset Admin Password | 24K Excellence</title><link rel="icon" href="assets/logo.png"><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"></head>
<body class="app-page admin-auth-page"><main class="auth-page"><section class="auth-showcase admin-auth-showcase"><a href="index.html"><img src="assets/logo.png" alt="24K Excellence"></a><h1>Secure Admin<br><span>password recovery.</span></h1><p>Create a strong new password for the dedicated Admin Control Center.</p></section><section class="auth-panel"><div class="auth-box admin-auth-box"><div class="auth-page-badge admin"><i class="fa-solid fa-user-shield"></i> ADMIN ACCESS</div><h2>Reset Admin Password</h2><p class="muted">Enter your new Admin password below.</p><form id="adminResetForm" class="auth-form on"><div class="form-field"><label>New Password</label><input type="password" name="password" minlength="8" required></div><div class="form-field"><label>Confirm Password</label><input type="password" name="confirm" minlength="8" required></div><button class="app-btn gold" type="submit">Update Admin Password</button></form></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js?v=9.20"></script><script src="assets/js/core.js?v=9.1"></script><script>document.getElementById('adminResetForm').addEventListener('submit',async e=>{e.preventDefault();const f=e.currentTarget,v=Object.fromEntries(new FormData(f));if(v.password!==v.confirm)return App.toast('Passwords do not match.','error');if(!App.configured||!App.supabase)return App.toast('Website setup is incomplete.','error');const b=f.querySelector('button');App.setLoading(b,true,'Updating...');const {error}=await App.supabase.auth.updateUser({password:v.password});App.setLoading(b,false);if(error)return App.toast(App.friendlyError(error),'error');App.toast('Admin password updated successfully.','success');setTimeout(()=>location.href='admin-login.html',700);});</script></body></html>
