<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Mentor Login | 24K MR ZERO</title><link rel="icon" href="/assets/logo.png"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08090a;color:#eee;font-family:Arial,sans-serif}.box{width:min(420px,calc(100vw - 36px));background:#111;border:1px solid #5a4619;border-radius:20px;padding:28px;box-shadow:0 25px 80px #000}.box img{display:block;width:150px;margin:0 auto 20px}.box h1{text-align:center;margin:0 0 8px}.box p{text-align:center;color:#999}.box label{display:block;margin-top:14px;font-size:13px;font-weight:700}.box input{width:100%;box-sizing:border-box;margin-top:6px;background:#0b0c0e;border:1px solid #34363a;color:#fff;padding:13px;border-radius:10px}.box button{width:100%;margin-top:18px;border:0;border-radius:11px;padding:13px;background:#e2ad36;color:#111;font-weight:900;cursor:pointer}.msg{margin-top:12px;text-align:center;color:#ff8585;font-size:13px}</style></head><body><form class="box" id="mentorLogin"><img src="/assets/logo.png" alt="24K MR ZERO"><h1>Mentor Login</h1><p>Content access only</p><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label><button>Sign In</button><div class="msg" id="msg"></div></form><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/assets/js/config.js?v=12.00"></script><script>(function(){const c=window.APP_CONFIG;const ref=new URL(c.SUPABASE_URL).hostname.split('.')[0];const sb=window.supabase.createClient(c.SUPABASE_URL,c.SUPABASE_ANON_KEY,{auth:{storageKey:`sb-${ref}-mentor-auth-token`,persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'pkce'}});const f=document.getElementById('mentorLogin'),m=document.getElementById('msg');f.onsubmit=async e=>{e.preventDefault();m.textContent='';const d=Object.fromEntries(new FormData(f));const b=f.querySelector('button');b.disabled=true;b.textContent='Signing in...';try{const {data,error}=await sb.auth.signInWithPassword({email:d.email,password:d.password});if(error)throw error;const {data:p,error:pe}=await sb.from('profiles').select('role,status').eq('id',data.user.id).single();if(pe)throw pe;if(p.role!=='mentor'||(p.status&&p.status!=='active')){await sb.auth.signOut();throw new Error('This account does not have active Mentor access.')}location.replace('/mentor/')}catch(x){m.textContent=x.message||'Could not sign in.'}finally{b.disabled=false;b.textContent='Sign In'}}})();</script></body></html>
