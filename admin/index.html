<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>24K Zero</title>
  <style>
    html,body{margin:0;min-height:100%;background:#0b0b0b;color:#fff;font-family:Arial,sans-serif}
    .z24-route-loading{min-height:100dvh;display:grid;place-items:center;text-align:center;padding:24px}
    .z24-route-loading b{color:#d8aa24;letter-spacing:.08em}
  </style>
</head>
<body>
  <div class="z24-route-loading"><div><b>24K ZERO</b><br><small>Loading secure panel…</small></div></div>
<script>
(async function () {
  "use strict";
  const routeType = "admin";
  const candidates = routeType === "student"
    ? ["../student-dashboard.html", "../student.html"]
    : ["../admin-dashboard.html", "../admin.html"];

  let html = "";
  let source = "";
  for (const url of candidates) {
    try {
      const r = await fetch(url, {cache:"no-store"});
      if (r.ok) { html = await r.text(); source = url; break; }
    } catch (_) {}
  }

  if (!html) {
    document.body.innerHTML = '<div class="z24-route-loading"><div><b>24K ZERO</b><br><small>Panel file could not be loaded.</small></div></div>';
    return;
  }

  // Keep every original dashboard feature, but make relative root assets work
  // from clean /student/ and /admin/ routes.
  html = html.replace(/<base\b[^>]*>/ig, "");
  html = html.replace(/<head([^>]*)>/i,
    '<head$1><base href="../"><link rel="stylesheet" href="assets/css/24k-zero-sep01-ui.css?v=20260901">');

  html = html.replace(/<body([^>]*)>/i,
    '<body$1 data-z24-clean-route="' + routeType + '">');

  if (routeType === "student") {
    // Fix the current TDZ crash without changing the rest of the source:
    // "Cannot access brokerAccessMeta before initialization".
    html = html.replace(/\b(?:const|let)\s+brokerAccessMeta\s*=/g, "brokerAccessMeta =");
    html = html.replace(/<head([^>]*)>/i,
      '<head$1><script>var brokerAccessMeta=window.brokerAccessMeta||{};window.brokerAccessMeta=brokerAccessMeta;<\/script>');
  }

  // Capture the exact Supabase client created by the existing app.
  const supabaseScript = /(<script\b[^>]*src=["'][^"']*supabase[^"']*["'][^>]*>\s*<\/script>)/i;
  if (supabaseScript.test(html)) {
    html = html.replace(supabaseScript,
      '$1<script src="assets/js/24k-zero-sep01-client-capture.js?v=20260901"><\/script>');
  } else {
    html = html.replace(/<\/head>/i,
      '<script src="assets/js/24k-zero-sep01-client-capture.js?v=20260901"><\/script></head>');
  }

  // Load this update after the existing dashboard scripts so all current
  // business/payment/broker handlers remain the source of truth.
  html = html.replace(/<\/body>/i,
    '<script src="assets/js/24k-zero-sep01-ui.js?v=20260901"><\/script></body>');

  document.open();
  document.write(html);
  document.close();
})().catch(function(err){
  console.error("24K clean-route loader:", err);
});
</script>
</body>
</html>
