<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Mentor Panel | 24K MR ZERO</title><link rel="icon" href="/assets/logo.png"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="/assets/css/v120-mentor.css?v=12.00"></head><body><div id="mentorLoad" class="load">Loading Mentor Panel...</div><div id="mentorApp" class="shell" hidden><aside><img src="/assets/logo.png" alt="24K"><nav id="mentorNav"><button data-view="dashboard" class="on"><i class="fa-solid fa-house"></i> Dashboard</button><button data-view="signals" data-feature="signals"><i class="fa-solid fa-bolt"></i> Signals</button><button data-view="charts" data-feature="charts"><i class="fa-solid fa-chart-line"></i> Charts</button><button data-view="articles" data-feature="articles"><i class="fa-solid fa-newspaper"></i> Articles</button><button data-view="announcements" data-feature="announcements"><i class="fa-solid fa-bullhorn"></i> Announcements</button></nav><button id="mentorLogout" class="logout">Logout</button></aside><main><header><div><h1>Mentor Panel</h1><small id="mentorName"></small></div></header><section data-panel="dashboard" class="view on"><h2>Content Dashboard</h2><div id="mentorKpis" class="kpis"></div><div class="note">Only modules enabled by Super Admin are available. Finance, users, payments and team controls are never exposed here.</div></section><section data-panel="signals" class="view"><h2>Signals</h2><form id="signalForm" class="card grid"><input name="symbol" placeholder="XAUUSD" required><select name="direction"><option>BUY</option><option>SELL</option></select><input name="entry_from" type="number" step="any" placeholder="Entry from"><input name="entry_to" type="number" step="any" placeholder="Entry to"><input name="stop_loss" type="number" step="any" placeholder="Stop Loss"><input name="take_profit_1" type="number" step="any" placeholder="TP1"><input name="take_profit_2" type="number" step="any" placeholder="TP2"><input name="take_profit_3" type="number" step="any" placeholder="TP3"><textarea name="notes" placeholder="Notes"></textarea><button>Publish Signal</button></form><div id="signalList" class="list"></div></section><section data-panel="charts" class="view"><h2>Charts</h2><form id="chartForm" class="card grid"><input name="title" placeholder="Chart title" required><input name="symbol" placeholder="XAUUSD" required><input name="timeframe" placeholder="H4"><input name="image_url" placeholder="Image URL"><textarea name="summary" placeholder="Analysis"></textarea><button>Publish Chart</button></form><div id="chartList" class="list"></div></section><section data-panel="articles" class="view"><h2>Articles</h2><form id="articleForm" class="card grid"><input name="title" placeholder="Article title" required><input name="slug" placeholder="article-slug" required><input name="cover_url" placeholder="Cover image URL"><textarea name="excerpt" placeholder="Excerpt"></textarea><textarea name="content" placeholder="Article content" required></textarea><button>Publish Article</button></form><div id="articleList" class="list"></div></section><section data-panel="announcements" class="view"><h2>Announcements</h2><form id="announcementForm" class="card grid"><input name="title" placeholder="Announcement title" required><select name="priority"><option value="normal">Normal</option><option value="important">Important</option></select><textarea name="message" placeholder="Message" required></textarea><button>Publish Announcement</button></form><div id="announcementList" class="list"></div></section></main></div><div id="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/assets/js/config.js?v=12.00"></script><script src="/assets/js/v120-mentor.js?v=12.00"></script></body></html>
