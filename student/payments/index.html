<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0A0A0A"><title>24K Excellence Student</title><script>(function(){try{var t=localStorage.getItem('24k-excellence-theme');document.documentElement.dataset.theme=t==='light'?'light':'dark'}catch(e){document.documentElement.dataset.theme='dark'}})();</script><style>html,body{margin:0;min-height:100%;background:#0a0a0a}html[data-theme="light"],html[data-theme="light"] body{background:#f6efe3}.route-loader{position:fixed;inset:0;display:grid;place-items:center;background:inherit;color:#c99a05;font:700 14px Arial,sans-serif;z-index:99999}.route-loader span{display:grid;gap:14px;justify-items:center}.route-loader i{display:block;width:28px;height:28px;border:3px solid rgba(201,154,5,.22);border-top-color:#c99a05;border-radius:50%;animation:r .72s linear infinite}.route-loader small{max-width:360px;text-align:center;color:#8f8f8f;font-weight:500;line-height:1.5}@keyframes r{to{transform:rotate(360deg)}}</style></head><body><div class="route-loader" aria-label="Loading"><span><i></i>Loading 24K Student...<small id="routeStatus">Preparing your dashboard</small></span></div><script>(function(){
  var panel='payments';
  var fallback='/student-dashboard.html#'+panel;
  var cacheKey='24k:v991:student-shell';
  function writePage(page){
    if(panel&&panel!=='dashboard'){
      page=page.replace(/<body([^>]*)>/i,function(m,a){return '<body'+a+'><script>try{location.hash='+JSON.stringify('#')+'+'+JSON.stringify(panel)+';}catch(e){}<\/script>';});
    }
    document.open();document.write(page);document.close();
  }
  function patchStudent(code){
    if(code.indexOf('brokerAccessMeta')>=0){
      if(!/var\s+brokerAccessMeta\s*=\s*\{\}/.test(code)) code=code.replace(/const\s+A\s*=\s*window\.App\s*;/,'const A = window.App;\n  var brokerAccessMeta = {};');
      code=code.replace(/\b(?:const|let)\s+brokerAccessMeta\s*=/g,'brokerAccessMeta =');
    }
    return code;
  }
  function fetchText(url,ms){
    var c=new AbortController(),t=setTimeout(function(){c.abort();},ms||7000);
    return fetch(url,{cache:'force-cache',credentials:'same-origin',signal:c.signal}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();}).finally(function(){clearTimeout(t);});
  }
  try{
    var cached=sessionStorage.getItem(cacheKey);
    if(cached){writePage(cached);return;}
  }catch(e){}
  var status=document.getElementById('routeStatus');
  var pagePromise=fetchText('/student-dashboard.html',7000);
  var jsPromise=fetchText('/assets/js/student.js',7000);
  Promise.all([pagePromise,jsPromise]).then(function(parts){
    var page=parts[0],studentCode=patchStudent(parts[1]);
    page=page.replace('<head>','<head><base href="/">');
    studentCode=studentCode.replace(/<\/script/gi,'<\\/script');
    var tag=/<script\b[^>]*\bsrc=(['"])[^'"]*assets\/js\/student\.js[^'"]*\1[^>]*><\/script>/i;
    if(!tag.test(page)) throw new Error('student.js script tag not found');
    page=page.replace(tag,'<script>'+studentCode+'<\/script>');
    page=page.replace('</body>','<script src="/assets/js/v971-student-signal-history.js?v=9.91"><\/script><script src="/assets/js/v990-student-runtime-fixes.js?v=9.91"><\/script><script>(function(){var started=Date.now();var timer=setInterval(function(){var l=document.getElementById("pageLoader"),a=document.getElementById("studentApp");if(!l||l.classList.contains("hidden")||(a&&!a.classList.contains("hidden"))){clearInterval(timer);return;}if(Date.now()-started>15000){clearInterval(timer);console.error("[V9.91] Student bootstrap exceeded 15s; keeping loader instead of showing an empty dashboard.");if(window.App&&typeof window.App.toast==="function")window.App.toast("Dashboard data is taking longer than expected. Please refresh once.","error",6000);}},500);})();<\/script></body>');
    try{sessionStorage.setItem(cacheKey,page);}catch(e){}
    writePage(page);
  }).catch(function(error){
    console.error('[V9.91] Student clean route bootstrap failed',error);
    if(status)status.textContent='Opening the direct student dashboard…';
    setTimeout(function(){location.replace(fallback);},120);
  });
})();</script></body></html>
