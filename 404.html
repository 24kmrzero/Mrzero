<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>24K MR ZERO</title>
  <style>
    html,body{margin:0;min-height:100%;background:#0b0b0b;color:#d9b64d;font-family:Arial,sans-serif}
    body{display:grid;place-items:center}
    .loader{display:grid;gap:14px;place-items:center;font-size:13px;font-weight:800}
    .loader:before{content:"";width:30px;height:30px;border:3px solid rgba(217,182,77,.22);border-top-color:#d9b64d;border-radius:50%;animation:r .7s linear infinite}
    @keyframes r{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="loader" id="status">Opening secure link...</div>
  <script>
  (function(){
    const path=location.pathname.replace(/\/+$/,'');
    if(path==='/index'||path==='/index.html'){location.replace('/'+location.search+location.hash);return}
    if(path==='/student'){location.replace('/student/'+location.search+location.hash);return}
    if(path==='/admin'){location.replace('/admin/'+location.search+location.hash);return}
    const m=path.match(/^\/r\/([^/]+)$/i);
    if(m){
      const ref=decodeURIComponent(m[1]||'').trim().toLowerCase();
      if(ref){location.replace('https://jsmthmmkafgvzzcjjihp.supabase.co/functions/v1/resolve-short-link?go=1&ref='+encodeURIComponent(ref));return}
    }
    document.body.innerHTML='<div style="font-family:Arial,sans-serif;padding:40px;text-align:center;color:#222;background:#fff;min-height:100vh;box-sizing:border-box"><h2>Page not found</h2><a href="/">Go Home</a></div>';
  })();
  </script>
</body>
</html>
