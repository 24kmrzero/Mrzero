<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>24K MR ZERO</title>
  <style>
    html,body{margin:0;min-height:100%;background:#0b0b0b;color:#d9b64d;font-family:Arial,sans-serif}
    body{display:grid;place-items:center}
    .loader{display:grid;gap:14px;place-items:center;font-size:13px;font-weight:700}
    .loader:before{content:"";width:30px;height:30px;border:3px solid rgba(217,182,77,.22);border-top-color:#d9b64d;border-radius:50%;animation:r .7s linear infinite}
    @keyframes r{to{transform:rotate(360deg)}}
    a{color:#d9b64d}
  </style>
</head>
<body>
  <div class="loader" id="status">Opening...</div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/config.js?v=11.11"></script>
  <script>
  (async function(){
    const status=document.getElementById('status');
    const path=location.pathname.replace(//+$/,'');
    if(path==='/index'||path==='/index.html')return location.replace('/'+location.search+location.hash);
    if(path==='/student')return location.replace('/student/'+location.search+location.hash);
    if(path==='/admin')return location.replace('/admin/'+location.search+location.hash);

    const match=path.match(/^/r/([^/]+)$/i);
    if(match){
      const ref=decodeURIComponent(match[1]||'').trim().toLowerCase();
      if(!ref){status.textContent='Invalid link.';return}
      status.textContent='Opening secure link...';
      try{
        const cfg=window.APP_CONFIG||{};
        if(!window.supabase?.createClient||!cfg.SUPABASE_URL||!cfg.SUPABASE_ANON_KEY)throw new Error('Service unavailable');
        const sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
        const {data,error}=await sb.rpc('resolve_tracking_link',{p_ref_code:ref});
        if(error)throw error;
        if(!data)throw new Error('Link not found');

        let destination=String(data.destination_path||'').trim();
        if(!destination)destination=(data.is_ad_link||data.course_id)?'/enroll/':'/sign-up/';
        if(!destination.startsWith('/'))destination='/'+destination;

        const u=new URL(destination,location.origin);
        u.searchParams.set('ref',ref);
        location.replace(u.toString());
        return;
      }catch(error){
        console.error(error);
        status.textContent='This link is unavailable.';
        return;
      }
    }

    document.body.innerHTML='<div style="font-family:Arial,sans-serif;padding:40px;text-align:center;color:#222;background:#fff;min-height:100vh;box-sizing:border-box"><h2>Page not found</h2><a href="/">Go Home</a></div>';
  })();
  </script>
</body>
</html>
