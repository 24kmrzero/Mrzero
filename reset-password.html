<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password | 24K Excellence</title><link rel="icon" href="assets/logo.png"><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"></head>
<body class="app-page"><main class="auth-page"><section class="auth-showcase"><a href="index.html"><img src="assets/logo.png" alt="24K Excellence"></a><h1>Create a new<br><span>secure password.</span></h1><p>Choose a strong password with at least eight characters.</p></section><section class="auth-panel"><div class="auth-box"><h2>Reset Password</h2><p class="muted">Enter your new password below.</p><form id="resetForm" class="auth-form on"><div class="form-field"><label>New Password</label><input type="password" name="password" minlength="8" required></div><div class="form-field"><label>Confirm Password</label><input type="password" name="confirm" minlength="8" required></div><button class="app-btn gold" type="submit">Update Password</button></form></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js"></script><script src="assets/js/core.js"></script><script>document.getElementById('resetForm').addEventListener('submit',async e=>{e.preventDefault();const f=e.currentTarget,v=Object.fromEntries(new FormData(f));if(v.password!==v.confirm)return App.toast('Passwords do not match.','error');if(!App.configured||!App.supabase){App.toast('Website setup is incomplete. Configure Supabase first.','error');return;}const b=f.querySelector('button');App.setLoading(b,true,'Updating...');const {error}=await App.supabase.auth.updateUser({password:v.password});App.setLoading(b,false);if(error)return App.toast(error.message,'error');App.toast('Password updated.','success');setTimeout(()=>location.href='login.html',600);});</script></body></html>
