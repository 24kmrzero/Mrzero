<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090b"><title>Reset Team Password | 24K MR ZERO</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="/assets/css/v1216-team-mobile.css?v=12.16"><style>body{margin:0;background:#070809;color:#fff;font-family:Inter,Arial,sans-serif}.reset-wrap{min-height:100dvh;display:grid;place-items:center;padding:20px}.reset-card{width:min(430px,100%);background:#111214;border:1px solid rgba(255,197,26,.28);border-radius:22px;padding:26px;box-shadow:0 25px 70px rgba(0,0,0,.45)}.reset-card img{height:42px;margin-bottom:18px}.reset-card small{color:#e8bc23;font-weight:900;letter-spacing:.12em}.reset-card h1{font-size:28px;margin:7px 0}.reset-card p{color:#999;font-size:12px;line-height:1.5}.reset-card label{display:grid;gap:7px;margin:14px 0;font-size:12px;font-weight:800}.reset-card input{height:48px;border-radius:12px;border:1px solid #343434;background:#0b0c0d;color:#fff;padding:0 13px;font-size:16px}.reset-card button{width:100%;height:48px;border:0;border-radius:12px;background:linear-gradient(#ffdc55,#efb300);font-weight:900}.status{margin-top:12px;color:#aaa;font-size:12px}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/assets/js/config.js"></script></head><body><main class="reset-wrap"><section class="reset-card"><img src="/assets/logo-v965.png" alt="24K MR ZERO"><small>TEAM SECURITY</small><h1>Choose New Password</h1><p>This secure Team reset link expires in 30 minutes and can only be used once.</p><form id="teamResetForm"><label>New Password<input name="password" type="password" minlength="8" autocomplete="new-password" required></label><label>Confirm Password<input name="confirm" type="password" minlength="8" autocomplete="new-password" required></label><button type="submit">Update Password</button></form><div id="teamResetStatus" class="status"></div></section></main><script>(function(){const c=window.APP_CONFIG||{},sb=window.supabase.createClient(c.SUPABASE_URL,c.SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false}}),f=document.getElementById('teamResetForm'),s=document.getElementById('teamResetStatus'),token=new URLSearchParams(location.search).get('token')||'';if(!token){s.textContent='This reset link is invalid or incomplete.';f.querySelector('button').disabled=true}f.addEventListener('submit',async e=>{e.preventDefault();const d=new FormData(f),p=String(d.get('password')||''),q=String(d.get('confirm')||'');if(p.length<8)return s.textContent='Use at least 8 characters.';if(p!==q)return s.textContent='Passwords do not match.';const b=f.querySelector('button');b.disabled=true;s.textContent='Updating password…';try{const {error}=await sb.rpc('confirm_team_password_reset',{p_token:token,p_password:p});if(error)throw error;s.textContent='Password updated. You can now sign in to Team Panel.';setTimeout(()=>location.href='/team/',1200)}catch(err){s.textContent=err.message||'This reset link is invalid or expired.'}finally{b.disabled=false}})})();</script></body></html>
